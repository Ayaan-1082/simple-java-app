apiVersion: apps/v1
kind: Deployment
metadata:
  name: config-web
  namespace: k8s-set-08
spec:
  replicas: 1
  selector:
    matchLabels:
      app: config-web
  template:
    metadata:
      labels:
        app: config-web
    spec:
      containers:
        - name: nginx
          image: nginx:1.28-alpine
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 96Mi
          volumeMounts:
            - name: website
              mountPath: /usr/share/nginx/html
              readOnly: true
      volumes:
        - name: website
          configMap:
            name: web-config
