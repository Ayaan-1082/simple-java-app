apiVersion: v1
kind: Pod
metadata:
  name: pvc-demo
  namespace: k8s-set-09
  labels:
    app: pvc-demo
spec:
  containers:
    - name: storage-writer
      image: busybox:1.37
      command: ["sh", "-c", "sleep 36000"]
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 100m
          memory: 96Mi
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: lab-storage
