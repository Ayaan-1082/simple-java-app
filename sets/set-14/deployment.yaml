apiVersion: v1
kind: Namespace
metadata:
  name: k8s-set-14
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: troubleshooting-web
  namespace: k8s-set-14
spec:
  replicas: 1
  progressDeadlineSeconds: 60
  selector:
    matchLabels:
      app: troubleshooting-web
  template:
    metadata:
      labels:
        app: troubleshooting-web
    spec:
      containers:
        - name: web
          image: k8s-practical/does-not-exist:invalid
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 100m, memory: 96Mi}
          readinessProbe:
            httpGet: {path: /, port: 80}
            initialDelaySeconds: 2
            periodSeconds: 3
